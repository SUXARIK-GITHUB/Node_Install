name: Offline installer checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-install-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies on disposable CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-cryptography python3-yaml nginx
      - name: Test embedded payloads; NEVER install a node on the runner
        run: |
          export PATH="/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          bash tests/run.sh
          git diff --check
