name: Offline installer checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-install-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies on disposable CI runner
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install -y --no-install-recommends python3 python3-cryptography python3-yaml nginx nodejs openssl git procps util-linux findutils nftables
      - name: Verify Git checkout and release files
        run: |
          git rev-parse --is-inside-work-tree
          git rev-parse HEAD
          sha256sum --check SHA256SUMS
          python3 scripts/verify_release.py
      - name: Test embedded payloads; NEVER install a node on the runner
        run: |
          export PATH="/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          id
          python3 --version
          nginx -v
          node --version
          apt-get --version
          # Do NOT add sudo: unprivileged execution catches escaped fixture paths.
          bash tests/run.sh
      - name: Check tracked files after tests
        run: |
          git diff --check
          git diff --exit-code

  ubuntu-26-userspace:
    # Uses a 24.04 host runner; this job does NOT validate a 26.04 kernel or reboot.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 20
    steps:
      # This image may lack Git. Bootstrap BEFORE checkout, otherwise checkout
      # falls back to archive download and subsequent git diff exits with 129.
      - name: Dependencies before checkout in disposable Ubuntu 26.04 container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o APT::Update::Error-Mode=any update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-cryptography python3-yaml nginx nodejs openssl procps util-linux findutils nftables
          git --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust only the current workspace in the disposable container
        run: |
          # checkout and shell steps can see different HOME/UID contexts.
          # Write the exact checkout path in THIS shell user's global config.
          : "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"
          [[ "$GITHUB_WORKSPACE" == /* ]]
          test -d "$GITHUB_WORKSPACE/.git"
          test "$(pwd -P)" = "$(cd -- "$GITHUB_WORKSPACE" && pwd -P)"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify Git checkout and release files
        run: |
          git rev-parse --is-inside-work-tree
          git rev-parse HEAD
          sha256sum --check SHA256SUMS
          python3 scripts/verify_release.py
      - name: Embedded helpers, protocols and synthetic failure paths only
        run: |
          export PATH="/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          id
          python3 --version
          nginx -v
          node --version
          apt-get --version
          bash tests/run.sh
      - name: Check tracked files after tests
        run: |
          git diff --check
          git diff --exit-code

  debian-userspace:
    # Debian 12/13 userspace regression only. Docker/systemd/firewall/kernel reboot NOT tested.
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        container: [debian:12, debian:13]
    steps:
      - name: Bootstrap dependencies in disposable container before Git checkout
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o APT::Update::Error-Mode=any update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-cryptography python3-yaml nginx nodejs openssl procps util-linux findutils nftables
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Git checkout and local release manifest
        run: |
          : "${GITHUB_WORKSPACE:?}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree
          sha256sum --check SHA256SUMS
          python3 scripts/verify_release.py
      - name: Run offline tests inside disposable Debian container
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          bash tests/run.sh
      - name: Confirm tests did not mutate versioned files
        run: |
          git diff --check
          git diff --exit-code
